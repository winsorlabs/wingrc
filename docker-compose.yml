# Shared by backend and worker below (YAML anchor) -- both need the
# identical DB/storage/credential-key config since they connect to the
# same database and the worker's own job bodies (scheduler.py) may need
# the same connector credentials backend does. Anchored once so the two
# can't drift apart the way docs/deployment.md's own §7 warns an update
# procedure can if only one of them gets remembered.
x-backend-env: &backend-env
  WINGRC_DATABASE_URL: postgresql+psycopg://wingrc:wingrc@db:5432/wingrc
  WINGRC_TEST_DATABASE_URL: postgresql+psycopg://wingrc:wingrc@db:5432/wingrc_test
  # Set explicitly (not left to Settings.environment's Python-level
  # default) so `wingrc reset-dev`'s production guard (cli.py) sees a
  # real "development" value here rather than reading as unset --
  # unset now refuses, on purpose, since that's the actual shape of a
  # fresh production deploy where nobody set this yet.
  WINGRC_ENVIRONMENT: development
  # The URL a browser uses to reach this deployment -- see config.py's own
  # docstring on this setting. Only consumed by routers/users.py (invite/
  # reset email links) and scheduler.py's review-cycle/SPRS-reminder jobs
  # (the link inside each notification) -- both backend AND worker need
  # it, since the worker is what actually sends those notifications.
  # Unset means those emails/notifications fall back to a link-less body
  # (routers/users.py's token-only response; scheduler.py's "the WinGRC
  # application" placeholder text) rather than a broken link.
  WINGRC_PUBLIC_URL: ${WINGRC_PUBLIC_URL:-}
  WINGRC_STORAGE_ENDPOINT: http://minio:9000
  # Set WINGRC_STORAGE_PUBLIC_ENDPOINT in your host .env to the address
  # browsers use to reach MinIO. Behind the nginx reverse proxy (see
  # docs/deployment.md) this is the dedicated storage subdomain, e.g.
  # https://storage.YOUR_HOSTNAME — NOT a path under the main app
  # hostname; MinIO's own bucket routing needs the unprefixed path, so
  # this must be a separate host, not a path prefix.
  # Without it, presigned URLs contain the internal 'minio' hostname
  # which browsers can't resolve.
  WINGRC_STORAGE_PUBLIC_ENDPOINT: ${WINGRC_STORAGE_PUBLIC_ENDPOINT:-}
  WINGRC_STORAGE_ACCESS_KEY: wingrc
  WINGRC_STORAGE_SECRET_KEY: wingrc-dev-secret
  # D.1: encrypts third-party integration credentials (Liongard, SMTP,
  # etc.) at rest — see crypto.py. This dev key is fine for local/bench
  # use only; a real deployment MUST set its own via a host .env override
  # (WINGRC_CREDENTIAL_ENCRYPTION_KEYS in the shell/`.env`, not this
  # file) and keep it out of git. crypto.py fails closed — with this
  # unset, storing/reading any integration credential is refused
  # outright rather than falling back to plaintext.
  WINGRC_CREDENTIAL_ENCRYPTION_KEYS: ${WINGRC_CREDENTIAL_ENCRYPTION_KEYS:-dev:DFKuK2mEIJpixerxDMGU5xyQQwpWQBZxCFjOaZKjNSs=}
  PYTHONPATH: /app

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wingrc
      POSTGRES_PASSWORD: wingrc
      POSTGRES_DB: wingrc
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingrc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for evidence. Same code path targets Azure
  # Blob or AWS S3 in the cloud; MinIO keeps self-host and air-gapped simple.
  #
  # No host-published ports: the backend reaches MinIO over the internal
  # Docker network (WINGRC_STORAGE_ENDPOINT). Browser-facing evidence/logo
  # downloads (presigned URLs) go through nginx's storage.YOUR_HOSTNAME
  # server block instead of a directly-published MinIO port — see
  # docs/deployment.md and deploy/nginx/nginx.conf.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wingrc
      MINIO_ROOT_PASSWORD: wingrc-dev-secret
      # Public URL MinIO advertises for itself when running behind the nginx
      # reverse proxy (used for its own redirects/self-checks, not for
      # signature validation). Should match the storage subdomain nginx
      # terminates TLS for, e.g. https://storage.YOUR_HOSTNAME. Leave unset
      # for local dev without a proxy in front.
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    volumes:
      - ./backend:/app
      # reset-dev's pre-flight pg_dump (cli.py) writes here — a named
      # volume, not a path under the bind-mounted ./backend above, so
      # backups survive a container recreate/rebuild instead of living
      # inside a git-tracked source directory.
      - backend_backups:/backups
    # --reload picks up host edits without a rebuild (volume mount keeps /app in sync).
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # The job scheduler's worker process (scheduler.py) -- same image as
  # backend, different command, so scheduled jobs (currently: expiring
  # stale invite tokens) run in a genuinely separate process and can never
  # freeze the API's single uvicorn worker the way a slow in-process job
  # would (see scheduler.py's own module docstring for the incident this
  # design avoids repeating). depends_on backend's own health, not just
  # db's, so the worker never queries job_run before backend's startup
  # `alembic upgrade head` has created it.
  #
  # OPTIONAL: an operator may omit this service entirely and use host cron
  # against `wingrc jobs-run-due` instead (see cli.py's jobs-run-due
  # docstring) -- the backend has no dependency on this service at request
  # time and stays fully functional either way. Omitting it just means
  # scheduled jobs never run, which the Administration -> Scheduled Jobs
  # panel then shows honestly (every job's "last run" stays empty) rather
  # than silently.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-env
    # This image's own Dockerfile bakes in an HTTP HEALTHCHECK (it hits
    # backend's :8000/health) -- correct for the `backend` service, wrong
    # here: `wingrc worker` serves no HTTP at all, so that inherited check
    # would fail forever and show this container permanently "unhealthy"
    # for a reason that has nothing to do with whether it's actually
    # working (confirmed live during bench verification -- see this
    # slice's own writeup). Disabled outright rather than replaced with a
    # process-liveness check: `docker compose ps`'s plain "Up" status
    # already answers "is the container running," and this service has no
    # HTTP endpoint of its own to probe instead.
    healthcheck:
      disable: true
    volumes:
      - ./backend:/app
    command: wingrc worker

  # Sole host-facing entry point (ports 80/443). Reverse-proxies to backend
  # and serves the frontend's production build directly — no frontend dev
  # server runs in this stack. See docs/deployment.md for TLS cert setup
  # (manual Let's Encrypt DNS-01) and deploy/nginx/nginx.conf for routing.
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Populated by a one-off, manually-run `certbot/certbot` container
      # (see docs/deployment.md) — not managed by this compose file. Must
      # exist before `docker compose up` (external: true below).
      - certs:/etc/letsencrypt:ro

volumes:
  db_data:
  minio_data:
  backend_backups:
  certs:
    external: true
    name: wingrc_certs
