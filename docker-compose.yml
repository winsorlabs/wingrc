# Shared by backend and worker below (YAML anchor) -- both need the
# identical DB/storage/credential-key config since they connect to the
# same database and the worker's own job bodies (scheduler.py) may need
# the same connector credentials backend does. Anchored once so the two
# can't drift apart the way docs/deployment.md's own §7 warns an update
# procedure can if only one of them gets remembered.
x-backend-env: &backend-env
  # Overridable from the host .env so the wingrc_app cutover is a config
  # change rather than an edit to this file. The default is the owning role,
  # built from POSTGRES_PASSWORD, because a fresh install has no wingrc_app
  # password yet. There is no shippable default for a credential, so no
  # password is written in this file (docs/roadmap.md, "The compose file
  # ships default credentials").
  WINGRC_DATABASE_URL: ${WINGRC_DATABASE_URL:-postgresql+psycopg://wingrc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- set it in .env, see docs/deployment.md}@db:5432/wingrc}
  # No WINGRC_TEST_DATABASE_URL here (removed 2026-11-18): it carried the
  # owner's password, a superuser, into every deployment's backend and
  # worker, and nothing at runtime reads it. A test run inside a container
  # passes it for that run (docs/bench-stack-verification.md, step 4).
  # tests/test_compose_required.py holds this.
  # Connection `alembic upgrade head` uses, and nothing else. Unset here on
  # purpose: WINGRC_DATABASE_URL above is still the owning role, which can
  # run DDL, so migrations work without it today.
  #
  # It becomes REQUIRED when WINGRC_DATABASE_URL is pointed at `wingrc_app`
  # (the RLS-enforced, no-DDL runtime role) -- at that point migrations and
  # request handling need different privileges and can no longer share one
  # string. Leaving it unset then is not silent: app/migrations/env.py
  # checks the connected role can create objects and exits naming this
  # variable. See docs/deployment.md.
  WINGRC_MIGRATION_DATABASE_URL: ${WINGRC_MIGRATION_DATABASE_URL:-}
  # Required, no default: "production" or "development" (config.py
  # refuses anything else). It decides the Secure flag on every cookie
  # (auth.py) and whether `wingrc reset-dev` may run (cli.py). Until
  # 2026-11-17 this was the literal "development", which no .env could
  # change, so every compose deployment, live included, issued its cookies
  # without Secure. A default would repeat that silently for a deployment
  # that forgot the line.
  WINGRC_ENVIRONMENT: ${WINGRC_ENVIRONMENT:?WINGRC_ENVIRONMENT is required -- set it in .env, see docs/deployment.md}
  # The URL a browser uses to reach this deployment -- see config.py's own
  # docstring on this setting. Only consumed by routers/users.py (invite/
  # reset email links) and scheduler.py's review-cycle/SPRS-reminder jobs
  # (the link inside each notification) -- both backend AND worker need
  # it, since the worker is what actually sends those notifications.
  # Unset means those emails/notifications fall back to a link-less body
  # (routers/users.py's token-only response; scheduler.py's "the WinGRC
  # application" placeholder text) rather than a broken link.
  WINGRC_PUBLIC_URL: ${WINGRC_PUBLIC_URL:-}
  WINGRC_STORAGE_ENDPOINT: http://minio:9000
  # Set WINGRC_STORAGE_PUBLIC_ENDPOINT in your host .env to the address
  # browsers use to reach MinIO. Behind the nginx reverse proxy (see
  # docs/deployment.md) this is the dedicated storage subdomain, e.g.
  # https://storage.YOUR_HOSTNAME — NOT a path under the main app
  # hostname; MinIO's own bucket routing needs the unprefixed path, so
  # this must be a separate host, not a path prefix.
  # Without it, presigned URLs contain the internal 'minio' hostname
  # which browsers can't resolve.
  WINGRC_STORAGE_PUBLIC_ENDPOINT: ${WINGRC_STORAGE_PUBLIC_ENDPOINT:-}
  # The backend's MinIO credentials. Required, no default: they were
  # literals here, so the guide's instruction to set them in .env could not
  # take effect.
  WINGRC_STORAGE_ACCESS_KEY: ${WINGRC_STORAGE_ACCESS_KEY:?WINGRC_STORAGE_ACCESS_KEY is required -- set it in .env, see docs/deployment.md}
  WINGRC_STORAGE_SECRET_KEY: ${WINGRC_STORAGE_SECRET_KEY:?WINGRC_STORAGE_SECRET_KEY is required -- set it in .env, see docs/deployment.md}
  # The HMAC key for the signed sign-in state cookies (auth.py). Required,
  # with no default: until 2026-11-17 this line did not exist, so every
  # compose deployment signed them with config.py's public default.
  WINGRC_AUTH_FLOW_SECRET: ${WINGRC_AUTH_FLOW_SECRET:?WINGRC_AUTH_FLOW_SECRET is required -- set it in .env, see docs/deployment.md}
  # D.1: encrypts third-party integration credentials (Liongard, SMTP, the
  # AI provider) at rest; see crypto.py. Required, no default: a key in this
  # public repo would be a vendor key every deployment shared. crypto.py
  # still fails closed for a deployment that does not use compose.
  WINGRC_CREDENTIAL_ENCRYPTION_KEYS: ${WINGRC_CREDENTIAL_ENCRYPTION_KEYS:?WINGRC_CREDENTIAL_ENCRYPTION_KEYS is required -- set it in .env, see docs/deployment.md}
  # Item S: hours before the newest local snapshot reads stale and raises
  # msp_admin's banner. Set for a daily schedule; the schedule is a host
  # cron line the backend cannot read, so a different schedule needs this
  # set beside it in the host .env (docs/deployment.md, "Local snapshots").
  # The default must equal config.py's (tests/test_snapshots.py).
  WINGRC_SNAPSHOT_MAX_AGE_HOURS: ${WINGRC_SNAPSHOT_MAX_AGE_HOURS:-50}
  PYTHONPATH: /app

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wingrc
      # Read only when the data volume is first initialised. Changing it
      # later does nothing to the role: an existing deployment changes the
      # password with ALTER ROLE (docs/deployment.md, "Moving off a default
      # credential").
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- set it in .env, see docs/deployment.md}
      POSTGRES_DB: wingrc
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingrc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for evidence. Same code path targets Azure
  # Blob or AWS S3 in the cloud; MinIO keeps self-host and air-gapped simple.
  #
  # No host-published ports: the backend reaches MinIO over the internal
  # Docker network (WINGRC_STORAGE_ENDPOINT). Browser-facing logo and
  # vendor-document downloads (presigned URLs; evidence streams through the
  # backend) go through nginx's storage.YOUR_HOSTNAME
  # server block instead of a directly-published MinIO port — see
  # docs/deployment.md and deploy/nginx/nginx.conf.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required -- set it in .env, see docs/deployment.md}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required -- set it in .env, see docs/deployment.md}
      # Public URL MinIO advertises for itself when running behind the nginx
      # reverse proxy (used for its own redirects/self-checks, not for
      # signature validation). Should match the storage subdomain nginx
      # terminates TLS for, e.g. https://storage.YOUR_HOSTNAME. Leave unset
      # for local dev without a proxy in front.
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data

  # Runs the code baked into the image, never a host checkout. Until
  # 2026-10-08 this bind-mounted ./backend over /app and ran uvicorn
  # --reload, so a bare `git pull` on the live host replaced the running
  # code within seconds while `alembic upgrade head` -- which only runs at
  # container start -- did not run at all. That is exactly what took the
  # live backend down on 2026-10-07 (docs/roadmap.md). It also meant the
  # code serving requests was "whatever was in the checkout", not an image
  # anyone built, scanned, or could name. Live-editing for local development
  # is opt-in via docker-compose.override.yml (see the .example).
  #
  # WINGRC_BUILD_SHA is stamped into the image and reported by /health, so
  # "which code is serving this" has an answer. deploy/deploy.sh sets it.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WINGRC_BUILD_SHA: ${WINGRC_BUILD_SHA:-unknown}
    restart: unless-stopped
    # The guard against an upload storm until uploads stream (2026-11-19,
    # docs/roadmap.md, "Every upload handler reads the whole file into
    # memory"). Each handler holds a whole body, up to its route's limit
    # (app/upload_limits.py: 51 MB for evidence), so forty at once is
    # about 2 GB, about what wl-util-1 has free. With no limit the host's
    # OOM killer chooses the victim, and Postgres scored 669 against the
    # backend's 694: close enough to be its choice. With one, the kill is
    # this container's own and can only take the backend, which restarts.
    # 1g is about five times its idle 212 MiB and fifteen 51 MB uploads at
    # once. Swap equal to it, so the container is killed rather than
    # pushing a gigabyte into the host's swap first and slowing the
    # database with it. A larger host raises it with WINGRC_BACKEND_MEMORY.
    mem_limit: ${WINGRC_BACKEND_MEMORY:-1g}
    memswap_limit: ${WINGRC_BACKEND_MEMORY:-1g}
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    volumes:
      # reset-dev's pre-flight pg_dump (cli.py) writes here -- a named
      # volume, so backups survive a container recreate/rebuild.
      - backend_backups:/backups
      # Local snapshots (deploy/snapshot.sh), read-only: /health reports
      # the newest one's age, and only `wingrc snapshot-create`, run on its
      # own, writes. A host directory, not a named volume, so that
      # `down -v` cannot take the snapshots with the data. One per compose
      # project, so a bench stack never reads or writes live's.
      - ${WINGRC_SNAPSHOT_DIR:-/var/lib/wingrc-snapshots/${COMPOSE_PROJECT_NAME}}:/snapshots:ro

  # The job scheduler's worker process (scheduler.py) -- same image as
  # backend, different command, so scheduled jobs (currently: expiring
  # stale invite tokens) run in a genuinely separate process and can never
  # freeze the API's single uvicorn worker the way a slow in-process job
  # would (see scheduler.py's own module docstring for the incident this
  # design avoids repeating). depends_on backend's own health, not just
  # db's, so the worker never queries job_run before backend's startup
  # `alembic upgrade head` has created it.
  #
  # OPTIONAL: an operator may omit this service entirely and use host cron
  # against `wingrc jobs-run-due` instead (see cli.py's jobs-run-due
  # docstring) -- the backend has no dependency on this service at request
  # time and stays fully functional either way. Omitting it just means
  # scheduled jobs never run, which the Administration -> Scheduled Jobs
  # panel then shows honestly (every job's "last run" stays empty) rather
  # than silently.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WINGRC_BUILD_SHA: ${WINGRC_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-env
    # This image's own Dockerfile bakes in an HTTP HEALTHCHECK (it hits
    # backend's :8000/health) -- correct for the `backend` service, wrong
    # here: `wingrc worker` serves no HTTP at all, so that inherited check
    # would fail forever and show this container permanently "unhealthy"
    # for a reason that has nothing to do with whether it's actually
    # working (confirmed live during bench verification -- see this
    # slice's own writeup). Disabled outright rather than replaced with a
    # process-liveness check: `docker compose ps`'s plain "Up" status
    # already answers "is the container running," and this service has no
    # HTTP endpoint of its own to probe instead.
    healthcheck:
      disable: true
    command: wingrc worker

  # Sole host-facing entry point (ports 80/443). Reverse-proxies to backend
  # and serves the frontend's production build directly — no frontend dev
  # server runs in this stack. See docs/deployment.md for TLS cert setup
  # (manual Let's Encrypt DNS-01) and deploy/nginx/nginx.conf for routing.
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        WINGRC_BUILD_SHA: ${WINGRC_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      - backend
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Populated by a one-off, manually-run `certbot/certbot` container
      # (see docs/deployment.md) — not managed by this compose file. Must
      # exist before `docker compose up` (external: true below).
      - certs:/etc/letsencrypt:ro

volumes:
  db_data:
  minio_data:
  backend_backups:
  certs:
    external: true
    name: wingrc_certs
