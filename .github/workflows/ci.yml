name: ci

# Runner pinned to ubuntu-24.04 rather than ubuntu-latest, deliberately.
# `ubuntu-latest` becomes Ubuntu 26 on 2026-10-19. This suite depends on
# runner-level detail that an image swap changes silently: the system
# `pg_dump` version (tests/test_cli_reset_dev.py skips against a
# version-mismatched binary, and that guard is written around "whatever
# ubuntu-latest ships"), and WeasyPrint's Pango/cairo system libraries
# installed below. Riding the migration means finding out at whatever
# moment GitHub rolls it; pinning makes the upgrade its own commit with
# its own CI run. TODO: move to ubuntu-26.04 deliberately after 2026-10-19.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04  # pinned -- see the header note
    env:
      # Fail the job if the run tested almost nothing -- see
      # backend/tests/conftest.py's count-floor section for the mechanism and
      # why the threshold lives in the environment. ~458 tests run here
      # today; the floor is deliberately less than half that so it catches
      # "nothing ran" without needing an edit every time the suite grows or
      # tests move between the two jobs.
      WINGRC_MIN_TESTS_RUN: "200"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        working-directory: backend
        # [dev,ai] -- backend/Dockerfile installs both; test_ai_connector.py,
        # test_document_ingest.py, and test_admin_products.py import
        # anthropic/pypdf/python-docx (the "ai" extra) at collection time, so
        # [dev] alone fails collection here even though it never touches a
        # database -- this isn't gated by the integration marker.
        run: pip install -e ".[dev,ai]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest -q

  integration:
    runs-on: ubuntu-24.04  # pinned -- see the header note
    # Deliberately NOT `needs: backend`. Two reasons, both learned the hard
    # way by runs #307-#312:
    #
    # 1. A skipped job is not a passed job, but a *required status check*
    #    that gets skipped is treated as satisfied. Gating this job on
    #    `backend` while also requiring it in branch protection would mean a
    #    broken `backend` silently waves the merge through on `integration`.
    #    Jobs that always run can be required honestly.
    # 2. From #308 onward `backend` failed in under a minute, so this job
    #    never ran at all -- which hid #307's genuine integration failure
    #    for five consecutive runs. Running both unconditionally costs a few
    #    runner-minutes on a red push and shows every failure at once
    #    instead of one per fix-and-push cycle.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wingrc
          POSTGRES_PASSWORD: wingrc
          POSTGRES_DB: wingrc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      WINGRC_DATABASE_URL: postgresql+psycopg://wingrc:wingrc@localhost:5432/wingrc
      # conftest.py's db_engine fixture only ever reads WINGRC_TEST_DATABASE_URL
      # (and pytest.skip()s cleanly when it's unset) — WINGRC_DATABASE_URL alone
      # left every @pytest.mark.integration test silently skipping in this job,
      # reporting green while testing nothing. Points at a separate wingrc_test
      # database, matching docker-compose.yml's own backend service env block.
      WINGRC_TEST_DATABASE_URL: postgresql+psycopg://wingrc:wingrc@localhost:5432/wingrc_test
      # D.1: crypto.py fails closed with this unset (see its module
      # docstring) — test_integrations.py's credential round-trip tests
      # need a real key here, same as docker-compose.yml's own dev default.
      # CI-only key, not used anywhere real.
      WINGRC_CREDENTIAL_ENCRYPTION_KEYS: "ci:b_Lz6E-GOuMYIlFxMZW61m6ro3fgGGeRhwptwa8POz8="
      # The guard for the incident the WINGRC_TEST_DATABASE_URL comment above
      # describes. That comment explains why the variable must be set; this
      # makes forgetting it *fail* instead of reporting green having touched
      # no database. ~1027 tests run here today; floor is under half.
      WINGRC_MIN_TESTS_RUN: "500"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # This job runs pytest directly on the runner, not inside backend/Dockerfile's
      # image — WeasyPrint (SSP PDF export) needs these as system packages, not
      # pure-Python wheels, so they must be installed here too. Keep this list in
      # sync with backend/Dockerfile's `base` stage.
      - name: "Install system libraries (WeasyPrint: Pango/cairo/gdk-pixbuf)"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi8 shared-mime-info
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev,ai]"
      - name: Migration chain (upgrade → downgrade → upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Integration tests
        working-directory: backend
        run: pytest -q -m integration

  image:
    runs-on: ubuntu-24.04  # pinned -- see the header note
    needs: [backend, integration]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t wingrc-backend:ci -f backend/Dockerfile .
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wingrc-backend:ci
          format: table
          exit-code: "0"   # report-only for now; flip to "1" to gate
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: wingrc-backend:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
